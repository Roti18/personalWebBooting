# Nama workflow yang akan muncul di tab "Actions" GitHub
name: Deploy Next.js to GitHub Pages

# Kapan workflow ini berjalan
on:
  # Berjalan setiap kali ada push ke branch "main"
  push:
    branches: ["main"]
  # Memungkinkan Anda menjalankan workflow ini secara manual dari tab Actions
  workflow_dispatch:

# Konfigurasi pekerjaan (jobs)
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Memberikan izin pada workflow untuk menulis ke repository
    permissions:
      contents: read
      pages: write
      id-token: write

    # Langkah-langkah yang akan dijalankan
    steps:
      # 1. Mengambil kode dari repository Anda
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Mengatur lingkungan Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Menggunakan Node.js versi 20
          cache: "npm"

      # 3. Menginstall semua dependency
      - name: Install Dependencies
        run: npm install

      # 4. Mem-build aplikasi Next.js (akan menghasilkan folder 'out')
      - name: Build
        run: npm run build

      # 5. Membuat file .nojekyll (PENTING!)
      # Ini memberitahu GitHub Pages untuk tidak menggunakan Jekyll,
      # agar folder yang diawali underscore (seperti _next) tidak diabaikan.
      - name: Create .nojekyll file
        run: touch out/.nojekyll

      # 6. Mengatur GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. Mengunggah artefak build (folder 'out')
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

      # 8. Men-deploy ke GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
